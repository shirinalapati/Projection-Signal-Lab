[project]
name = "projection-signal-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pybaseball>=2.2.7",
  "pandas",
  "numpy",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "plotly",
  "pyarrow",
  "statsmodels",
  "joblib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
